services:
  mathador-app:
    build: .
    depends_on:
      postgres-database:
        condition: service_healthy
        restart: true
    post_start:
      - command: python manage.py migrate
    volumes:
      - static_files:/usr/src/app/staticfiles_build/static
    healthcheck:
      test: ["CMD", "wget", "http://127.0.0.1:8000/main/health-check"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 5s
    

  postgres-database:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      PGPORT: ${DATABASE_PORT}
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DATABASE_USER}", "-d", "${DATABASE_NAME}"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 5s

  nginx:
    image: nginx:1.13-alpine
    ports:
      - 8765:8765
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - static_files:/www/data/staticfiles_build/static
    depends_on:
      mathador-app:
        condition: service_healthy
        restart: true
  
volumes:
  postgres_data:
  static_files: